name: Check opportunity pages

on:
  schedule:
    - cron: "0 14 * * *"   # every day at 14:00 UTC (about 6-7 AM Pacific)
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: check-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Check pages
        run: python check.py

      - name: Save results
        if: always()
        run: |
          git config user.name "opportunity-bot"
          git config user.email "opportunity-bot@users.noreply.github.com"
          git add changes.csv state.json
          git diff --cached --quiet || git commit -m "Daily check $(date -u +%F)"
          git push
